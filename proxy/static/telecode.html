<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Mode · Telecode</title>
<meta name="description" content="Telecode Team Mode: workspaces, agents and their internal files, jobs, pipelines, runs and heartbeat." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%237cc4ff'/><path d='M13 4L6 13.5h5L10 20l7-9.5h-5z' fill='%23052034'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/shared/appnav.css" />
<link rel="stylesheet" href="/shared/manager.css" />
<script>
  // Apply the saved theme (shared with TeleDesign) before first paint.
  try {
    var p = JSON.parse(localStorage.getItem("td:theme") || '"system"');
    document.documentElement.dataset.theme = p === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
  } catch (e) {}
</script>
<style>
  /* Team Mode — page-specific pieces (kit: /shared/manager.css) */
  .overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ov-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .ov-card .top { display: flex; align-items: center; gap: 10px; }
  .ov-card .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .ov-card .badge .ic { width: 17px; height: 17px; }
  .ov-card .n { font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .ov-card p { margin: 0; color: var(--muted); font-size: 12.5px; flex: 1; }
  .steps-how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .steps-how > div { padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; border-right: 1px solid var(--border); }
  .steps-how > div:last-child { border-right: 0; }
  .steps-how b { width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 11px; flex-shrink: 0; }
  .steps-how div div { font-size: 12.5px; color: var(--muted); } .steps-how div div strong { color: var(--text); display: block; font-weight: 600; margin-bottom: 2px; }
  .runrow { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .runrow:last-child { border-bottom: 0; } .runrow:hover { background: var(--hover); }
  .runrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

  /* Internal files editor */
  .ifiles .tabs { padding: 0 8px; }
  .ifiles textarea { border: 0; border-radius: 0; background: var(--well); min-height: 340px; height: 44vh; resize: vertical; box-shadow: none !important; padding: 12px 14px; }
  .ifiles .foot { border-top: 1px solid var(--border); padding: 9px 12px; display: flex; flex-direction: column; gap: 8px; }
  .hb-result { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .hb-result .line { font: 11.5px var(--mono); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .hb-result .line.bad { color: var(--err); } .hb-result .line.good { color: var(--text); }
  .hb-result .line .ic { width: 12px; height: 12px; align-self: center; }

  /* Pipeline lanes */
  .mode-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mode-opt { border: 1px solid var(--border); border-radius: 9px; background: var(--panel2); padding: 9px 10px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mode-opt:hover { border-color: var(--border-strong); }
  .mode-opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .mode-opt:disabled { cursor: not-allowed; opacity: .6; }
  .mode-opt b { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .mode-opt b .ic { width: 14px; height: 14px; color: var(--faint); } .mode-opt.on b .ic { color: var(--accent); }
  .mode-opt span { font-size: 11.5px; color: var(--faint); }
  .lanes { display: flex; flex-direction: column; }
  .lane { border: 1px solid var(--border); border-radius: 12px; background: var(--panel2); }
  .lane.parallel { border-color: var(--accent-line); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--panel2); }
  .lane-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; }
  .lane-head .lbl { font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
  .lane-head .num { width: 20px; height: 20px; border-radius: 6px; background: var(--raised); border: 1px solid var(--border-strong); display: grid; place-items: center; font: 600 11px var(--mono); }
  .lane-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 0 10px 10px; }
  .connector { display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; color: var(--faint); font-size: 11.5px; position: relative; }
  .connector::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-strong); }
  .connector > span { position: relative; background: var(--bg); padding: 1px 8px; border-radius: 99px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 5px; }
  .connector > span.feeds { color: var(--accent); border-color: var(--accent-line); background: var(--panel); }
  .connector .ic { width: 12px; height: 12px; }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 12px; min-width: 0; }
  .step-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; min-width: 0; }
  .step-head .t { font: 600 11.5px var(--mono); color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .field { margin-bottom: 8px; }
  .step textarea { min-height: 58px; }
  .add-step { margin-top: 12px; }

  .team-engine .select { flex: 1.1; } .team-engine .input { flex: 1; min-width: 0; }
  .eng-tag { font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  details.adv { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 5px; }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary .ic { width: 13px; height: 13px; transition: transform .12s; }
  details.adv[open] summary .ic { transform: rotate(90deg); }

  /* Runs */
  .run-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px; border-bottom: 1px solid var(--border); scrollbar-width: thin; }
  .run-chip { flex-shrink: 0; min-width: 150px; border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px; background: var(--panel2); cursor: pointer; display: flex; flex-direction: column; gap: 5px; text-align: left; }
  .run-chip:hover { border-color: var(--border-strong); }
  .run-chip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .run-chip .l1 { display: flex; gap: 6px; align-items: center; font-size: 11.5px; }
  .run-chip .l2 { display: flex; gap: 3px; align-items: center; }
  .run-chip .sd { width: 14px; height: 5px; border-radius: 3px; background: var(--border-strong); }
  .run-chip .sd.ok { background: var(--ok); } .run-chip .sd.err { background: var(--err); } .run-chip .sd.accent { background: var(--accent); } .run-chip .sd.warn { background: var(--warn); }
  .monitor { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .mon-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stepblock { border: 1px solid var(--border); border-radius: 11px; background: var(--panel); overflow: hidden; }
  .stepblock > .sb-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
  .stepblock > .sb-head:hover { background: var(--hover); }
  .stepblock > .sb-head .chev { transition: transform .12s; width: 14px; height: 14px; color: var(--faint); }
  .stepblock.open > .sb-head .chev { transform: rotate(90deg); }
  .stepblock .sb-body { display: none; padding: 0 12px 12px; flex-direction: column; gap: 10px; }
  .stepblock.open .sb-body { display: flex; }
  .sb-prog { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .sb-prog .bar { flex: 1; }

  @media (max-width: 1100px) { :root { --rail-w: 240px; } }
  @media (max-width: 1180px) {
    .overview { grid-template-columns: 1fr 1fr 1fr; }
    .mode-pick { grid-template-columns: 1fr 1fr; }
    .page { padding: 18px 20px 56px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <div class="shell">
    <aside class="rail" id="sidebar" aria-label="Team Mode navigation">
      <div class="rail-top">
        <label class="search" title="Filter workspaces, agents and jobs  (/)">
          <span class="ic" aria-hidden="true"></span>
          <input class="input" id="rail-search" type="search" placeholder="Filter…" autocomplete="off" spellcheck="false" aria-label="Filter sidebar" />
          <kbd>/</kbd>
        </label>
      </div>
      <div class="rail-body" id="rail-body">
        <section data-group="ws">
          <div class="rail-group"><span class="t" data-toggle="ws"><span class="gi"></span>Workspaces <span class="count" id="count-ws">0</span></span><span id="sidebar-add-ws-host"></span></div>
          <div class="rail-sub" id="ws-list"></div>
        </section>
        <section data-group="agent">
          <div class="rail-group"><span class="t" data-toggle="agent"><span class="gi"></span>Agents <span class="count" id="count-agent">0</span></span><span id="sidebar-add-agent-host"></span></div>
          <div class="rail-sub" id="agent-list"></div>
        </section>
        <section data-group="job">
          <div class="rail-group"><span class="t" data-toggle="job"><span class="gi"></span>Jobs <span class="count" id="count-job">0</span></span><span id="sidebar-add-job-host"></span></div>
          <div class="rail-sub">
            <div class="seg full sm" id="job-tabs" role="tablist" aria-label="Job kind" style="margin: 2px 2px 6px">
              <button type="button" role="tab" id="job-tab-user" class="on">User <span class="count" id="count-job-user">0</span></button>
              <button type="button" role="tab" id="job-tab-heartbeat">Heartbeat <span class="count" id="count-job-hb">0</span></button>
            </div>
            <div id="job-list"></div>
          </div>
        </section>
      </div>
    </aside>
    <main class="main" id="main">
      <div id="viewer" class="page"></div>
    </main>
  </div>
</div>

<script src="/shared/appnav.js"></script>
<script src="/shared/manager.js"></script>
<script>
"use strict";
// ═══ Team Mode ═══════════════════════════════════════════════════════════
// Every endpoint, payload and polling interval below is unchanged from the
// previous page; only the rendering changed (DOM-built, no untrusted innerHTML).
//   5s  GET /api/sessions, /api/agents, /api/jobs  (+ /api/runs on the overview)
//   1s  GET /api/runs/{id} + /api/tasks/{step.task_id} while a run is live

const INTERNAL_FILES = ["SOUL.md", "USER.md", "AGENT.md", "MEMORY.md", "HEARTBEAT.md"];
const INTERNAL_HINTS = {
  "SOUL.md": "Core identity, purpose and values. Staged into every run's workspace.",
  "USER.md": "Who the agent works for — preferences, context, constraints.",
  "AGENT.md": "Operating instructions. Staged as CLAUDE.md / AGENTS.md for the engine.",
  "MEMORY.md": "Long-term memory. Written back after each run.",
  "HEARTBEAT.md": "Schedules as YAML inside ```yaml fences — each entry becomes a heartbeat job. Not staged into runs.",
};

let state = {
  workspaces: [], agents: [], jobs: [],
  loaded: { ws: false, agent: false, job: false }, loadError: null,
  activeType: null, activeId: null,
  executionTaskId: null, executionTimer: null,
  internalContent: {}, internalDirty: {}, activeInternalFile: INTERNAL_FILES[0],
  activeJobTab: "user",
  pipelineDraft: { mode: "single", steps: [] },
  activeRunId: null, heartbeatValid: null,
  jobDirty: false, wsDirty: false, filter: "",
  watchedLive: false, recentRuns: null,
};

// ── Chrome ─────────────────────────────────────────────────────────────
renderTopbar($("topbar"), "team");
document.querySelector("#sidebar .search .ic").replaceWith(icon("search"));
$("sidebar-add-ws-host").replaceWith(btn(null, { icon: "plus", kind: "quiet", size: "sm", id: "sidebar-add-ws", title: "New workspace  (W)", onClick: () => createWorkspacePrompt() }));
$("sidebar-add-agent-host").replaceWith(btn(null, { icon: "plus", kind: "quiet", size: "sm", id: "sidebar-add-agent", title: "New agent  (A)", onClick: () => createAgentPrompt() }));
$("sidebar-add-job-host").replaceWith(btn(null, { icon: "plus", kind: "quiet", size: "sm", id: "sidebar-add-job", title: "New job  (J)", onClick: () => createJobPrompt() }));
document.querySelectorAll(".rail-group .gi").forEach(g => g.replaceWith(icon("chevronDown")));
const collapsedGroups = new Set(prefs.get("mgr:railCollapsed", []));
document.querySelectorAll("[data-toggle]").forEach(t => {
  const sec = t.closest("section"), key = t.dataset.toggle;
  const apply = () => { sec.querySelector(".rail-group").classList.toggle("collapsed", collapsedGroups.has(key)); sec.querySelector(".rail-sub").classList.toggle("hidden", collapsedGroups.has(key)); };
  t.addEventListener("click", () => { collapsedGroups.has(key) ? collapsedGroups.delete(key) : collapsedGroups.add(key); prefs.set("mgr:railCollapsed", [...collapsedGroups]); apply(); });
  apply();
});
$("job-tab-user").onclick = () => selectJobTab("user");
$("job-tab-heartbeat").onclick = () => selectJobTab("heartbeat");
$("rail-search").addEventListener("input", (e) => { state.filter = e.target.value.trim().toLowerCase(); renderSidebar(true); });
$("rail-search").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.target.value = ""; state.filter = ""; renderSidebar(true); e.target.blur(); } });

function selectJobTab(tab) {
  state.activeJobTab = tab;
  $("job-tab-user").classList.toggle("on", tab === "user");
  $("job-tab-heartbeat").classList.toggle("on", tab === "heartbeat");
  $("job-tab-user").setAttribute("aria-selected", String(tab === "user"));
  $("job-tab-heartbeat").setAttribute("aria-selected", String(tab === "heartbeat"));
  renderSidebar(true);
}

// ── Engines (Team Mode speaks engine ids; the executor maps them to task types) ─
const TEAM_ENGINES = [["claude_code", "Claude Code"], ["codex", "Codex"], ["antigravity", "Antigravity"]];
const engineLabel = (id) => (TEAM_ENGINES.find(e => e[0] === id) || [id, id])[1];
let engineInfo = null;   // GET /api/design/engines → {engines:[{id, models:[{id,label}]}], local:{models}}
async function loadEngineInfo() {
  try { engineInfo = await api("/api/design/engines"); } catch { engineInfo = { engines: [], local: { models: [] } }; }
  document.querySelectorAll("input[data-model-for]").forEach(fillModelList);
}
function modelsFor(engine, local) {
  if (!engineInfo) return [];
  if (local) return (engineInfo.local && engineInfo.local.models) || [];
  const e = (engineInfo.engines || []).find(x => x.id === engine);
  return (e && e.models) || [];
}
let modelListSeq = 0;
function fillModelList(input) {
  const dl = document.getElementById(input.getAttribute("list")); if (!dl) return;
  mount(dl, modelsFor(input.dataset.modelFor, input.dataset.local === "1").map(m => h("option", { value: m.id }, m.label && m.label !== m.id ? m.label : null)));
}
// teamEngine({ids, engine, model, local, inherit, disabled, onChange}) → {el, get()}
// inherit=true adds "Run default"; model + local are then inherited too.
function teamEngine(o) {
  const sel = h("select", { class: "select", id: o.ids && o.ids.engine, disabled: o.disabled || null, title: "Engine" },
    o.inherit ? h("option", { value: "" }, "Run default") : null,
    TEAM_ENGINES.map(([id, label]) => h("option", { value: id }, label)));
  sel.value = o.engine || (o.inherit ? "" : "claude_code");
  const listId = "models-" + (++modelListSeq);
  const model = h("input", { class: "input", id: o.ids && o.ids.model, list: listId, value: o.model || "", placeholder: o.inherit ? "inherit model" : "default model",
    autocomplete: "off", spellcheck: "false", disabled: o.disabled || null, title: "Model (blank = the engine's default)" });
  const local = h("input", { type: "checkbox", id: o.ids && o.ids.local, role: "switch", disabled: o.disabled || null });
  local.checked = !!o.local;
  const sw = h("label", { class: "switch-field", title: LOCAL_TIP }, h("span", { class: "switch" }, local, h("span")), h("span", null, "Local"), icon("info"));
  const get = () => ({ engine: sel.value, model: model.value.trim(), is_local: local.checked });
  const sync = () => {
    const inherit = !sel.value;
    model.disabled = !!o.disabled || inherit; local.disabled = !!o.disabled || inherit;
    if (inherit) { model.value = ""; local.checked = false; }
    sw.classList.toggle("on", local.checked);
    sw.style.opacity = inherit ? ".5" : "";
    sw.title = inherit ? "Inherits the run's local-mode setting — pick an engine to override" : LOCAL_TIP;
    model.dataset.modelFor = sel.value || "claude_code"; model.dataset.local = local.checked ? "1" : "0";
    fillModelList(model);
  };
  const changed = () => { sync(); if (o.onChange) o.onChange(get()); };
  sel.addEventListener("change", changed); local.addEventListener("change", changed);
  model.addEventListener("input", () => { if (o.onChange) o.onChange(get()); });
  const el = h("div", { class: "engine-row team-engine" }, sel, model, h("datalist", { id: listId }), sw);
  queueMicrotask(sync);
  return { el, get, select: sel, model, local, sync };
}

// ── Helpers ────────────────────────────────────────────────────────────
function wsName(ws) { return (ws && ws.data && ws.data.name) || (ws && ws.session_id) || ""; }
function agentName(id) { const a = state.agents.find(x => x.id === id); return a ? a.name : null; }
function anyInternalDirty() { return Object.values(state.internalDirty).some(Boolean); }
function hasUnsaved() {
  return (state.activeType === "agent" && anyInternalDirty()) || (state.activeType === "job" && state.jobDirty) || (state.activeType === "ws" && state.wsDirty);
}
async function guardLeave() {
  if (!hasUnsaved()) return true;
  const ok = await confirmDialog("Discard unsaved changes?", "You have edits on this page that haven't been saved.", { confirm: "Discard", danger: true });
  if (ok) { state.internalDirty = {}; state.jobDirty = false; state.wsDirty = false; }
  return ok;
}
addEventListener("beforeunload", (e) => { if (hasUnsaved()) { e.preventDefault(); e.returnValue = ""; } });
function setHash() {
  const h_ = state.activeType ? `#/${state.activeType}/${encodeURIComponent(state.activeId)}` : "";
  try { history.replaceState(null, "", location.pathname + location.search + h_); } catch { /* ignore */ }
}
function stopExecTimer() { if (state.executionTimer) clearInterval(state.executionTimer); state.executionTimer = null; }
function pageHead({ title, icon: ic, pills = [], sub = [], tools = [] }) {
  return h("div", { class: "page-head" },
    h("div", { class: "ttl" }, h("h1", null, title, pills), h("div", { class: "sub" }, sub)),
    h("div", { class: "tools" }, tools));
}
function card(title, ic, opts = {}, ...body) {
  return h("section", { class: "card", id: opts.id || null },
    h("div", { class: "card-head" }, h("h3", null, icon(ic), title, opts.hint ? h("span", { class: "hint" }, opts.hint) : null), opts.actions || null),
    h("div", { class: "card-body" + (opts.flush ? " flush" : "") }, body));
}
function field(label, input, hint, o = {}) {
  return h("label", { class: "field", style: o.style || null }, h("span", { class: "field-label" }, label, o.req ? h("span", { class: "req" }, "*") : null, o.extra || null),
    input, o.err || null, hint ? h("span", { class: "field-hint" }, hint) : null);
}

// ── Welcome / overview ─────────────────────────────────────────────────
function showDefaultView() {
  state.activeId = null; state.activeType = null;
  stopExecTimer(); setHash();
  renderSidebar(true);
  renderOverview();
}
function renderOverview() {
  const v = $("viewer");
  const tile = (ic, n, label, text, act) => h("div", { class: "ov-card" },
    h("div", { class: "top" }, h("span", { class: "badge" }, icon(ic)), h("div", { class: "grow" }, h("div", { class: "n" }, n), h("div", { class: "muted" }, label))),
    h("p", null, text), act);
  const userJobs = state.jobs.filter(j => (j.kind || "user") === "user").length;
  mount(v,
    pageHead({ title: "Team Mode", sub: [h("span", null, "Agents with persistent identity and memory, running jobs as pipelines inside workspaces.")],
      tools: [btn("New job", { icon: "plus", kind: "primary", onClick: () => createJobPrompt(), title: "New job  (J)" })] }),
    h("div", { class: "overview" },
      tile("folder", state.workspaces.length, "Workspaces", "Folders a job runs in. Files you add here are visible to every step.", btn("New workspace", { icon: "plus", kind: "ghost", size: "sm", onClick: () => createWorkspacePrompt() })),
      tile("agents", state.agents.length, "Agents", "Each agent owns SOUL, USER, AGENT, MEMORY and HEARTBEAT files.", btn("New agent", { icon: "plus", kind: "ghost", size: "sm", onClick: () => createAgentPrompt() })),
      tile("workflow", state.jobs.length, "Jobs", `${userJobs} user · ${state.jobs.length - userJobs} heartbeat. A job is a pipeline of agent steps.`, btn("New job", { icon: "plus", kind: "ghost", size: "sm", onClick: () => createJobPrompt() }))),
    h("section", { class: "card" }, h("div", { class: "card-head" }, h("h3", null, icon("sparkle"), "How it fits together")),
      h("div", { class: "steps-how" },
        h("div", null, h("b", null, "1"), h("div", null, h("strong", null, "Create a workspace"), "The folder a job's steps read and write.")),
        h("div", null, h("b", null, "2"), h("div", null, h("strong", null, "Create agents"), "Give each one a SOUL and instructions in its internal files.")),
        h("div", null, h("b", null, "3"), h("div", null, h("strong", null, "Build a job and run it"), "Chain agents sequentially, fan out in parallel, or mix both in phases.")))),

      state.watchedLive = false;

  if (state.activeType === m[1] && state.activeId === id) return true;
  if (m[1] === "ws" && state.workspaces.some(w => w.session_id === id)) selectWorkspace(id);
  else if (m[1] === "agent" && state.agents.some(a => a.id === id)) selectAgent(id);
  else if (m[1] === "job" && state.jobs.some(j => j.id === id)) {
    const j = state.jobs.find(x => x.id === id); if ((j.kind || "user") !== state.activeJobTab) selectJobTab(j.kind || "user");
    selectJob(id);
  } else return false;
  return true;
}
addEventListener("hashchange", () => { if (!routeFromHash() && !location.hash) showDefaultView(); });
(async () => {
  renderSidebar(true);
  loadEngineInfo();
  const m = /^#\/(ws|agent|job)\/(.+)$/.exec(location.hash);
  if (!m) renderOverview(); else loadingView("Loading…");
  await Promise.all([refreshWorkspaces(), refreshAgents(), refreshJobs()]);
  if (m) { if (!routeFromHash()) showDefaultView(); } else renderOverview();
})();
setInterval(() => {
  refreshWorkspaces();
  refreshAgents();
  refreshJobs();
  if (!state.activeType && $("recent-runs")) refreshRecentRuns();
}, 5000);
</script>
</body>
</html>
