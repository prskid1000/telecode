<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neutral · Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="../../specimen.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="../actions/Button.jsx"></script>
<script type="text/babel" data-presets="react" src="Nav.jsx"></script>
<script type="text/babel" data-presets="react">
const SEARCH = <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>;
function Specimen() {
  return (<>
  <Nav brand="Northwind" items={[{ label: "Overview", active: true }, { label: "Projects" }, { label: "Reports" }]}
    actions={<><Button variant="ghost" size="icon" aria-label="Search">{SEARCH}</Button><Button size="sm">New</Button></>} />
  <Nav orientation="vertical" brand="Northwind" items={[{ label: "Inbox", active: true }, { label: "Drafts" }, { label: "Archive" }]} actions={<Button size="sm" variant="outline">Settings</Button>} />
  </>);
}
function Pane({ theme }) {
  return <section className="td-pane" data-theme={theme}><div className="td-pane__label">Nav · {theme}</div><Specimen /></section>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<div className="td-panes td-panes--stack"><Pane theme="light" /><Pane theme="dark" /></div>);
</script>
</body>
</html>
